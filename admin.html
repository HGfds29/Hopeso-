<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hopeso管理员面板</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 5px; }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; background: #fafafa; }
        .hidden { display: none; }
        input[type="password"], input[type="date"], input[type="file"] { padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; width: 100%; max-width: 300px; }
        button { padding: 8px 15px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 5px 0; }
        .error { color: #e74c3c; }
        .success { color: #27ae60; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hopeso map管理员面板</h1>

        <div id="loginSection" class="section">
            <h2>登录</h2>
            <input type="password" id="passwordInput" placeholder="请输入管理员密码">
            <button id="loginButton">登录</button>
            <div id="loginError" class="error"></div>
        </div>

        <div id="adminContent" class="hidden">
            <div class="section">
                <h2>管理员列表</h2>
                <div id="adminList">加载中...</div>
            </div>
            <div class="section">
                <h2>日期管理</h2>
                <div id="dateList">加载中...</div>
                <input type="date" id="newDateInput">
                <button id="addDateBtn">添加日期</button>
                <button id="saveDatesBtn">保存到数据库</button>
                <div id="dateMessage"></div>
            </div>
            <div class="section">
                <h2>地图上传</h2>
                <input type="date" id="uploadDateInput">
                <input type="file" id="mapFileInput" accept="image/*">
                <button id="uploadMapBtn">上传地图</button>
                <div id="uploadMessage"></div>
            </div>
            <div class="section">
                <h2>维护模式</h2>
                <p>状态：<span id="maintenanceStatus">未知</span></p>
                <button id="toggleMaintenanceBtn">切换维护模式</button>
                <div id="maintenanceMessage"></div>
            </div>
            <button id="logoutButton">退出登录</button>
        </div>
    </div>

    <script>
        // 配置
        const ADMIN_PASSWORD = 'hopeso_admin';
        const SUPABASE_URL = 'https://fnnikuyrxprbykyggxwy.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_e5JWjJVaHT9PvXtvuulh4A_OnjaQtvo';
        const REST_URL = `${SUPABASE_URL}/rest/v1`;
        const STORAGE_BUCKET = 'map_images';

        // 封装 REST 请求
        async function supabaseFetch(path, options = {}) {
            const headers = {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                'Content-Type': 'application/json',
                ...options.headers
            };
            const response = await fetch(`${REST_URL}/${path}`, { ...options, headers });
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`HTTP ${response.status}: ${errorText}`);
            }
            // 处理空响应体（PATCH、DELETE 成功时 Supabase 可能无返回内容）
            const contentType = response.headers.get('content-type') || '';
            const contentLength = response.headers.get('content-length');
            if (contentLength === '0' || !contentType.includes('application/json')) {
                return null;
            }
            try {
                return await response.json();
            } catch (e) {
                // 响应体为空或非 JSON 时返回 null，避免 "Unexpected end of JSON input"
                return null;
            }
        }

        // 登录逻辑
        function login() {
            const pwd = document.getElementById('passwordInput').value;
            if (pwd === ADMIN_PASSWORD) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                document.getElementById('loginError').textContent = '';
                loadAdminList();
                loadDates();
                loadMaintenanceStatus();
            } else {
                document.getElementById('loginError').textContent = '密码错误，请重试';
            }
        }

        function logout() {
            document.getElementById('adminContent').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('passwordInput').value = '';
        }

        // 加载管理员列表
        async function loadAdminList() {
            try {
                const admins = await supabaseFetch('admins?select=*');
                let html = '';
                admins.forEach(a => {
                    html += `<div>${a.name} (${a.role || '未知角色'})</div>`;
                });
                document.getElementById('adminList').innerHTML = html || '暂无管理员';
            } catch (e) {
                document.getElementById('adminList').innerHTML = '加载失败：' + e.message;
            }
        }

        // 日期管理
        let currentDates = [];
        async function loadDates() {
            try {
                const dates = await supabaseFetch('map_dates?select=date&order=date.desc');
                currentDates = dates.map(d => d.date);
                renderDateList();
            } catch (e) {
                document.getElementById('dateList').innerHTML = '加载失败：' + e.message;
            }
        }
        function renderDateList() {
            const div = document.getElementById('dateList');
            if (currentDates.length === 0) {
                div.innerHTML = '暂无日期';
                return;
            }
            div.innerHTML = '<ul>' + currentDates.map(d => `<li>${d}</li>`).join('') + '</ul>';
        }
        function addDate() {
            const newDate = document.getElementById('newDateInput').value;
            if (!newDate) return;
            if (!currentDates.includes(newDate)) {
                currentDates.push(newDate);
                currentDates.sort((a,b) => b.localeCompare(a));
                renderDateList();
                document.getElementById('dateMessage').textContent = '日期已添加（未保存）';
            } else {
                document.getElementById('dateMessage').textContent = '日期已存在';
            }
        }
        async function saveDates() {
            try {
                // 获取现有日期
                const existing = await supabaseFetch('map_dates?select=date');
                const existingSet = new Set(existing.map(d => d.date));
                // 删除不再存在的日期
                for (const date of existingSet) {
                    if (!currentDates.includes(date)) {
                        await supabaseFetch(`map_dates?date=eq.${date}`, { method: 'DELETE' });
                    }
                }
                // 插入新日期
                for (const date of currentDates) {
                    if (!existingSet.has(date)) {
                        await supabaseFetch('map_dates', {
                            method: 'POST',
                            body: JSON.stringify({ date })
                        });
                    }
                }
                document.getElementById('dateMessage').textContent = '保存成功';
                loadDates();
            } catch (e) {
                document.getElementById('dateMessage').textContent = '保存失败：' + e.message;
            }
        }

        // 地图上传（使用 Storage API）
        async function uploadMap() {
            const fileInput = document.getElementById('mapFileInput');
            const date = document.getElementById('uploadDateInput').value;
            if (!fileInput.files[0] || !date) {
                document.getElementById('uploadMessage').textContent = '请选择文件和日期';
                return;
            }
            const file = fileInput.files[0];
            const fileName = `map_${date}.png`;
            const formData = new FormData();
            formData.append('file', file, fileName);
            try {
                const response = await fetch(`${SUPABASE_URL}/storage/v1/object/${STORAGE_BUCKET}/${fileName}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'apikey': SUPABASE_ANON_KEY
                    },
                    body: formData
                });
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`上传失败: ${errorText}`);
                }
                // 写入数据库
                await supabaseFetch('map_images', {
                    method: 'POST',
                    body: JSON.stringify({ date, image_path: fileName })
                });
                document.getElementById('uploadMessage').textContent = '上传成功';
                document.getElementById('uploadMessage').className = 'success';
            } catch (e) {
                document.getElementById('uploadMessage').textContent = '' + e.message;
                document.getElementById('uploadMessage').className = 'error';
            }
        }

        // 维护模式
        async function loadMaintenanceStatus() {
            try {
                const data = await supabaseFetch("site_config?key=eq.maintenance&select=value");
                const value = data.length > 0 ? data[0].value : 'false';
                document.getElementById('maintenanceStatus').textContent = value === 'true' ? '开启' : '关闭';
            } catch (e) {
                document.getElementById('maintenanceStatus').textContent = '未知';
            }
        }
        async function toggleMaintenance() {
            try {
                const data = await supabaseFetch("site_config?key=eq.maintenance&select=value");
                const current = data.length > 0 ? data[0].value : 'false';
                const newValue = current === 'true' ? 'false' : 'true';
                if (data.length > 0) {
                    // 记录已存在，使用 PATCH 更新
                    await supabaseFetch('site_config?key=eq.maintenance', {
                        method: 'PATCH',
                        body: JSON.stringify({ value: newValue })
                    });
                } else {
                    // 记录不存在，使用 POST 插入
                    await supabaseFetch('site_config', {
                        method: 'POST',
                        body: JSON.stringify({ key: 'maintenance', value: newValue })
                    });
                }
                loadMaintenanceStatus();
                document.getElementById('maintenanceMessage').textContent = '已切换';
            } catch (e) {
                document.getElementById('maintenanceMessage').textContent = '操作失败：' + e.message;
            }
        }

        // 事件绑定
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('loginButton').addEventListener('click', login);
            document.getElementById('logoutButton').addEventListener('click', logout);
            document.getElementById('addDateBtn').addEventListener('click', addDate);
            document.getElementById('saveDatesBtn').addEventListener('click', saveDates);
            document.getElementById('uploadMapBtn').addEventListener('click', uploadMap);
            document.getElementById('toggleMaintenanceBtn').addEventListener('click', toggleMaintenance);
            document.getElementById('passwordInput').addEventListener('keyup', function(e) {
                if (e.key === 'Enter') login();
            });
        });
    </script>
</body>
</html>
