<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hopeso土豆服务器地图</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
            background: #0d1117;
            color: #e6edf3;
            user-select: none;
            display: flex;
            flex-direction: column;
        }
        /* 顶部标题栏 */
        .header {
            min-height: 56px;
            background: linear-gradient(90deg, #161b22, #1c2128);
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            z-index: 100;
            position: relative;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #58a6ff, #79c0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .version-badge {
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 600;
            color: #d29922;
            background: rgba(210,153,34,0.12);
            border: 1px solid rgba(210,153,34,0.35);
            border-radius: 10px;
            letter-spacing: 0.5px;
        }
        .header .spacer { flex: 1; }

        /* 顶部按钮通用样式 */
        .log-btn, .feedback-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            color: #58a6ff;
            background: rgba(88,166,255,0.08);
            border: 1px solid rgba(88,166,255,0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            letter-spacing: 0.5px;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }
        .log-btn:hover, .feedback-btn:hover {
            background: rgba(88,166,255,0.18);
            border-color: #58a6ff;
            box-shadow: 0 0 12px rgba(88,166,255,0.25);
        }
        .log-btn:active, .feedback-btn:active { transform: scale(0.96); }
        .log-btn .icon, .feedback-btn .icon { font-size: 16px; line-height: 1; }

        /* 日期下拉菜单 */
        .date-picker-wrap { display: flex; align-items: center; gap: 8px; }
        .date-picker-wrap label { font-size: 13px; color: #8b949e; }
        .date-picker {
            color-scheme: dark;
            background: #161b22;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s ease;
            min-width: 140px;
        }
        .date-picker:hover { border-color: #58a6ff; }
        .date-picker:focus { border-color: #58a6ff; box-shadow: 0 0 0 2px rgba(88,166,255,0.2); }
        .date-picker:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 地图容器 */
        .map-wrapper {
            position: relative;
            flex: 1;
            overflow: hidden;
            cursor: grab;
            touch-action: none;
            background: #0d1117;
        }
        .map-wrapper:active { cursor: grabbing; }

        /* 工具栏 */
        .toolbar {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn {
            width: 44px; height: 44px;
            border: 1px solid #30363d;
            background: #161b22;
            color: #e6edf3;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .btn:hover { background: #1f2937; border-color: #58a6ff; transform: translateY(-1px); }
        .btn:active { transform: scale(0.95); }
        .btn { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

        .map-stage { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; z-index: 1; }
        .map-stage img { display: block; max-width: none; pointer-events: none; }

        /* 棋盘格背景 */
        .bg-watermark {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                repeating-linear-gradient(0deg, rgba(88,166,255,0.05) 0, rgba(88,166,255,0.05) 1px, transparent 1px, transparent 48px),
                repeating-linear-gradient(90deg, rgba(88,166,255,0.05) 0, rgba(88,166,255,0.05) 1px, transparent 1px, transparent 48px),
                repeating-conic-gradient(#161b22 0% 25%, #1c2128 0% 50%);
            background-size: 48px 48px, 48px 48px, 48px 48px;
            background-position: 0 0, 0 0, 0 0;
        }

        .zoom-info {
            position: absolute; bottom: 16px; left: 20px;
            background: rgba(22,27,34,0.85);
            border: 1px solid #30363d;
            padding: 6px 12px; border-radius: 6px;
            font-size: 12px; color: #8b949e;
            backdrop-filter: blur(4px); z-index: 5;
        }
        .zoom-info span { color: #58a6ff; font-weight: 600; }

        /* 空状态 */
        .empty {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #8b949e; text-align: center; gap: 16px;
            pointer-events: none; z-index: 2;
        }
        .empty .icon { font-size: 48px; opacity: 0.4; }
        .empty p { font-size: 14px; }
        .hidden { display: none !important; }

        /* 更新日志弹窗 & 反馈弹窗 */
        .log-modal-overlay, .feedback-modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            animation: fadeIn 0.2s ease;
            padding: 20px;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(24px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .log-modal, .feedback-modal {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            max-width: 520px; width: 100%; max-height: 75vh;
            display: flex; flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            animation: slideUp 0.28s cubic-bezier(0.22,1,0.36,1);
            overflow: hidden;
        }
        .log-modal-header, .feedback-modal-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 24px 14px;
            border-bottom: 1px solid #21262d;
        }
        .log-modal-header h2, .feedback-modal-header h2 { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .log-modal-close, .feedback-modal-close {
            width: 34px; height: 34px; border: none; background: transparent;
            color: #8b949e; font-size: 20px; cursor: pointer;
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
        }
        .log-modal-close:hover, .feedback-modal-close:hover { background: #21262d; color: #e6edf3; }
        .log-modal-body, .feedback-modal-body { padding: 18px 24px 24px; overflow-y: auto; flex: 1; }

        /* 更新日志样式 */
        .log-entry { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px dashed #21262d; }
        .log-entry:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .log-entry-version { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
        .ver-tag { font-size: 14px; font-weight: 700; color: #58a6ff; background: rgba(88,166,255,0.1); border: 1px solid rgba(88,166,255,0.25); padding: 3px 10px; border-radius: 6px; }
        .ver-date { font-size: 12px; color: #8b949e; }
        .ver-current { font-size: 11px; color: #d29922; background: rgba(210,153,34,0.12); border: 1px solid rgba(210,153,34,0.3); padding: 2px 8px; border-radius: 4px; font-weight: 600; }
        .log-entry ul { list-style: none; padding-left: 4px; }
        .log-entry li { position: relative; padding-left: 18px; font-size: 13px; color: #c9d1d9; line-height: 1.7; margin-bottom: 4px; }
        .log-entry li::before { content: ''; position: absolute; left: 2px; top: 10px; width: 6px; height: 6px; border-radius: 50%; background: #58a6ff; }
        .log-entry li.type-fix::before { background: #f0883e; }
        .log-entry li.type-new::before { background: #3fb950; }
        .log-entry li.type-opt::before { background: #a371f7; }
        .log-entry li.type-ui::before { background: #79c0ff; }

        /* 反馈弹窗内部样式 */
        .feedback-warning {
            background: rgba(210,153,34,0.1);
            border: 1px solid rgba(210,153,34,0.4);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 16px;
            color: #d29922;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .feedback-warning .warning-icon { font-size: 18px; flex-shrink: 0; }
        .feedback-template {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            font-family: "Consolas", "Monaco", monospace;
            font-size: 12px;
            color: #c9d1d9;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 16px;
        }
        .feedback-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .feedback-btn-copy, .feedback-btn-github, .feedback-btn-api {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid #30363d;
            background: #21262d;
            color: #e6edf3;
            transition: all 0.2s ease;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            -webkit-tap-highlight-color: transparent;
        }
        .feedback-btn-copy:hover, .feedback-btn-github:hover, .feedback-btn-api:hover {
            border-color: #58a6ff;
            background: #1f2937;
        }
        .feedback-btn-github { background: rgba(88,166,255,0.1); border-color: rgba(88,166,255,0.3); color: #58a6ff; }
        .feedback-btn-github:hover { background: rgba(88,166,255,0.18); }
        .feedback-btn-api { background: rgba(240,136,62,0.1); border-color: rgba(240,136,62,0.3); color: #f0883e; }
        .feedback-btn-api:hover { background: rgba(240,136,62,0.18); }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .header { padding: 8px 12px; gap: 6px 10px; }
            .header h1 { font-size: 16px; }
            .version-badge { font-size: 11px; padding: 2px 8px; }
            .log-btn, .feedback-btn { padding: 5px 10px; font-size: 12px; gap: 4px; }
            .date-picker-wrap { width: 100%; order: 3; }
            .date-picker { flex: 1; min-width: 0; font-size: 14px; padding: 8px 10px; }
            .toolbar { top: 12px; right: 12px; gap: 6px; }
            .btn { width: 40px; height: 40px; font-size: 18px; }
            .zoom-info { bottom: 12px; left: 12px; font-size: 11px; }
            .log-modal, .feedback-modal { max-width: 100%; max-height: 80vh; }
            .log-modal-body, .feedback-modal-body { padding: 14px 18px 18px; }
            .feedback-template { font-size: 11px; }
            .feedback-warning { font-size: 12px; }
        }
        @media (max-width: 480px) {
            .header h1 { font-size: 15px; }
            .log-btn, .feedback-btn { font-size: 11px; padding: 4px 8px; }
            .btn { width: 38px; height: 38px; font-size: 17px; }
            .zoom-info { font-size: 10px; }
            .feedback-btn-copy, .feedback-btn-github, .feedback-btn-api { font-size: 12px; padding: 6px 12px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Hopeso土豆服务器地图</h1>
        <span class="version-badge" id="versionBadge"></span>
        <div class="spacer"></div>
        <button class="log-btn" id="logBtn" title="查看更新日志">
            <span class="icon">📋</span>
            <span>更新日志</span>
        </button>
        <button class="feedback-btn" id="feedbackBtn" title="提交网站反馈">
            <span class="icon">💬</span>
            <span>网站反馈</span>
        </button>
        <div class="date-picker-wrap">
            <label for="datePicker">日期:</label>
            <select id="datePicker" class="date-picker" disabled>
                <option>加载中...</option>
            </select>
        </div>
    </div>

    <!-- 地图容器 -->
    <div class="map-wrapper" id="wrapper">
        <div class="bg-watermark"></div>
        <div class="map-stage" id="stage">
            <img id="mapImg" alt="地图">
        </div>
        <div class="toolbar">
            <button class="btn" id="zoomIn" title="放大">＋</button>
            <button class="btn" id="zoomOut" title="缩小">－</button>
            <button class="btn" id="reset" title="重置">⟳</button>
        </div>
        <div class="empty" id="empty">
            <div class="icon">🧩</div>
            <p>当前区域暂时没有绘图</p>
        </div>
    </div>

    <div class="zoom-info">缩放: <span id="zoomVal">100</span>%</div>

    <!-- 更新日志弹窗 -->
    <div class="log-modal-overlay hidden" id="logOverlay">
        <div class="log-modal">
            <div class="log-modal-header">
                <h2>📋 版本更新日志</h2>
                <button class="log-modal-close" id="logClose">✕</button>
            </div>
            <div class="log-modal-body" id="logBody"></div>
        </div>
    </div>

    <!-- 反馈弹窗 -->
    <div class="feedback-modal-overlay hidden" id="feedbackOverlay">
        <div class="feedback-modal">
            <div class="feedback-modal-header">
                <h2>💬 提交网站反馈</h2>
                <button class="feedback-modal-close" id="feedbackClose">✕</button>
            </div>
            <div class="feedback-modal-body">
                <div class="feedback-warning">
                    <span class="warning-icon">⚠️</span>
                    <span>fine-grained token 随时可能过期，如果无法正常提交反馈，请联系管理员。</span>
                </div>
                <p style="font-size:14px; color:#8b949e; margin-bottom:12px;">您可以选择复制模板手动提交，或使用下方按钮通过 API 直接提交（测试功能，存在安全风险）。</p>
                <div class="feedback-template" id="feedbackTemplate"></div>
                <div class="feedback-actions">
                    <button class="feedback-btn-copy" id="copyFeedback">📋 复制反馈内容</button>
                    <button class="feedback-btn-github" id="openGithubIssue">🐙 打开 GitHub 新建 Issue</button>
                    <button class="feedback-btn-api" id="submitApiIssue">⚡ 直接提交 Issue (API)</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    (function() {
        const VERSION = 'beta2.0';
        document.getElementById('versionBadge').textContent = VERSION;
        document.title = `Hopeso土豆服务器地图 (${VERSION})`;

        // ================= 完整更新日志（从 beta1.0 到 beta2.0） =================
        const CHANGELOG = [
            {
                version: 'beta2.0',
                date: '2026-09-06',
                current: true,
                changes: [
                    { type: 'new', text: '整体升级至 beta2.0，优化代码结构与性能' },
                    { type: 'new', text: '改进地图加载速度，增加缓存策略' },
                    { type: 'fix', text: '修复部分移动设备上缩放异常的问题' },
                    { type: 'opt', text: '优化反馈弹窗的交互体验' },
                    { type: 'ui', text: '微调界面细节，提升视觉一致性' }
                ]
            },
            {
                version: 'beta1.8',
                date: '2026-09-06',
                current: false,
                changes: [
                    { type: 'new', text: '新增通过 GitHub API 直接提交 Issue 的测试功能（需手动配置 token）' },
                    { type: 'fix', text: '修复反馈弹窗在移动端的显示问题' }
                ]
            },
            {
                version: 'beta1.7',
                date: '2026-09-06',
                current: false,
                changes: [
                    { type: 'new', text: '反馈弹窗增加警告：fine-grained token 可能过期，无法提交时请联系管理员' }
                ]
            },
            {
                version: 'beta1.6',
                date: '2026-09-06',
                current: false,
                changes: [
                    { type: 'new', text: '反馈按钮改为弹出模态框，不再自动跳转' },
                    { type: 'ui', text: '新增反馈弹窗样式，与更新日志风格统一' }
                ]
            },
            {
                version: 'beta1.5',
                date: '2026-09-06',
                current: false,
                changes: [
                    { type: 'new', text: '新增「网站反馈」按钮，可直接跳转 GitHub Issue 提交反馈' }
                ]
            },
            {
                version: 'beta1.4',
                date: '2026-09-06',
                current: false,
                changes: [
                    { type: 'fix', text: '修复缩放工具栏被头部遮挡的问题' }
                ]
            },
            {
                version: 'beta1.3',
                date: '2026-09-06',
                current: false,
                changes: [
                    { type: 'ui', text: '地图未覆盖区域改为棋盘格块状背景' },
                    { type: 'ui', text: '空状态图标更改为拼图块' }
                ]
            },
            {
                version: 'beta1.2',
                date: '2026-09-06',
                current: false,
                changes: [
                    { type: 'new', text: '日期选项改为从「地图日期.json」文件动态读取' },
                    { type: 'opt', text: '优化日期下拉菜单的加载状态与错误提示' }
                ]
            },
            {
                version: 'beta1.1',
                date: '2026-09-05',
                current: false,
                changes: [
                    { type: 'new', text: '新增版本更新日志弹窗，点击顶部「更新日志」按钮即可查看' },
                    { type: 'fix', text: '修复移动端日期选择器在部分浏览器上的显示异常' },
                    { type: 'opt', text: '优化地图加载失败时的提示信息展示' },
                    { type: 'ui', text: '调整顶部标题栏布局，适配更小屏幕尺寸' }
                ]
            },
            {
                version: 'beta1.0',
                date: '2026-08-28',
                current: false,
                changes: [
                    { type: 'new', text: '首次发布，支持按日期加载服务器地图' },
                    { type: 'new', text: '支持鼠标滚轮缩放、拖拽平移地图' },
                    { type: 'new', text: '支持移动端双指缩放与单指拖动' },
                    { type: 'ui', text: '全新暗色主题界面，针对移动端深度优化' }
                ]
            }
        ];

        // ================= DOM 元素 =================
        const wrapper = document.getElementById('wrapper');
        const stage = document.getElementById('stage');
        const img = document.getElementById('mapImg');
        const zoomInBtn = document.getElementById('zoomIn');
        const zoomOutBtn = document.getElementById('zoomOut');
        const resetBtn = document.getElementById('reset');
        const zoomVal = document.getElementById('zoomVal');
        const empty = document.getElementById('empty');
        const datePicker = document.getElementById('datePicker');
        const logBtn = document.getElementById('logBtn');
        const logOverlay = document.getElementById('logOverlay');
        const logClose = document.getElementById('logClose');
        const logBody = document.getElementById('logBody');
        const feedbackBtn = document.getElementById('feedbackBtn');
        const feedbackOverlay = document.getElementById('feedbackOverlay');
        const feedbackClose = document.getElementById('feedbackClose');
        const feedbackTemplate = document.getElementById('feedbackTemplate');
        const copyFeedbackBtn = document.getElementById('copyFeedback');
        const openGithubBtn = document.getElementById('openGithubIssue');
        const submitApiBtn = document.getElementById('submitApiIssue');

        // ================= 更新日志弹窗 =================
        function renderChangelog() {
            let html = '';
            CHANGELOG.forEach(entry => {
                html += `<div class="log-entry">
                    <div class="log-entry-version">
                        <span class="ver-tag">${entry.version}</span>
                        ${entry.date ? `<span class="ver-date">${entry.date}</span>` : ''}
                        ${entry.current ? '<span class="ver-current">当前版本</span>' : ''}
                    </div>
                    <ul>`;
                entry.changes.forEach(change => {
                    html += `<li class="type-${change.type}">${change.text}</li>`;
                });
                html += '</ul></div>';
            });
            logBody.innerHTML = html;
        }

        function openLogModal() {
            renderChangelog();
            logOverlay.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        function closeLogModal() {
            logOverlay.classList.add('hidden');
            document.body.style.overflow = '';
        }
        logBtn.addEventListener('click', openLogModal);
        logClose.addEventListener('click', closeLogModal);
        logOverlay.addEventListener('click', e => {
            if (e.target === logOverlay) closeLogModal();
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                if (!logOverlay.classList.contains('hidden')) closeLogModal();
                if (!feedbackOverlay.classList.contains('hidden')) closeFeedbackModal();
            }
        });

        // ================= 反馈弹窗 =================
        function buildFeedbackTemplate() {
            const repo = "HGfds29/Hopeso-";
            const title = "【网站反馈】";
            const body = `## 反馈类型\n- [ ] Bug报错\n- [ ] 功能建议\n- [ ] 其他问题\n\n## 问题描述\n请在这里描述你的问题：\n\n## 当前页面地址\n${window.location.href}\n\n## 浏览器信息\n${navigator.userAgent}\n\n> 提示：可以直接截图粘贴到这里上传图片`;
            return { repo, title, body };
        }

        let currentRepo = '';
        let currentTitle = '';
        function openFeedbackModal() {
            const { repo, title, body } = buildFeedbackTemplate();
            currentRepo = repo;
            currentTitle = title;
            feedbackTemplate.textContent = body;
            feedbackOverlay.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        function closeFeedbackModal() {
            feedbackOverlay.classList.add('hidden');
            document.body.style.overflow = '';
        }
        feedbackBtn.addEventListener('click', openFeedbackModal);
        feedbackClose.addEventListener('click', closeFeedbackModal);
        feedbackOverlay.addEventListener('click', e => {
            if (e.target === feedbackOverlay) closeFeedbackModal();
        });

        // 复制反馈内容
        copyFeedbackBtn.addEventListener('click', async () => {
            const text = feedbackTemplate.textContent;
            try {
                await navigator.clipboard.writeText(text);
                copyFeedbackBtn.textContent = '✅ 已复制！';
                setTimeout(() => copyFeedbackBtn.innerHTML = '📋 复制反馈内容', 2000);
            } catch {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                copyFeedbackBtn.textContent = '✅ 已复制！';
                setTimeout(() => copyFeedbackBtn.innerHTML = '📋 复制反馈内容', 2000);
            }
        });

        // 打开 GitHub Issue 页面（手动）
        openGithubBtn.addEventListener('click', () => {
            const baseUrl = `https://github.com/${currentRepo}/issues/new`;
            const params = new URLSearchParams({ title: currentTitle, body: feedbackTemplate.textContent });
            window.open(`${baseUrl}?${params.toString()}`, '_blank');
        });

        // ================= 直接通过 GitHub API 提交 Issue =================
        // ⚠️ 警告：以下 token 仅用于测试，请勿在生产环境使用！
        const GITHUB_TOKEN = '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'; // 请替换为安全的 token 或通过后端获取
        const REPO_OWNER = 'HGfds29';
        const REPO_NAME = 'Hopeso-';

        submitApiBtn.addEventListener('click', async () => {
            const title = currentTitle || '【网站反馈】';
            const body = feedbackTemplate.textContent;
            submitApiBtn.textContent = '⏳ 提交中...';
            submitApiBtn.disabled = true;

            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github+json',
                        'Content-Type': 'application/json',
                        'X-GitHub-Api-Version': '2022-11-28'
                    },
                    body: JSON.stringify({ title, body })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || `HTTP ${response.status}`);
                }

                const issue = await response.json();
                submitApiBtn.textContent = '✅ 提交成功！';
                submitApiBtn.disabled = false;
                alert(`Issue 创建成功：${issue.html_url}`);
            } catch (error) {
                console.error('提交 Issue 失败:', error);
                submitApiBtn.textContent = '❌ 提交失败，请重试';
                submitApiBtn.disabled = false;
                alert(`提交失败：${error.message}\n可能 token 已过期或权限不足，请联系管理员。`);
            }
        });

        // ================= 日期加载与地图逻辑 =================
        async function loadDateList() {
            try {
                const response = await fetch('地图日期.json');
                if (!response.ok) throw new Error('网络响应失败');
                const data = await response.json();
                let dates = Array.isArray(data) ? data : (data.dates || []);
                dates = dates.filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)).sort((a,b) => b.localeCompare(a));
                if (dates.length === 0) throw new Error('日期列表为空');
                datePicker.innerHTML = '';
                const today = new Date().toISOString().split('T')[0];
                dates.forEach(date => {
                    const opt = document.createElement('option');
                    opt.value = date;
                    let label = date;
                    if (date === today) label += '（今天）';
                    else if (date === new Date(Date.now() - 86400000).toISOString().split('T')[0]) label += '（昨天）';
                    opt.textContent = label;
                    datePicker.appendChild(opt);
                });
                datePicker.disabled = false;
                if (dates.length > 0) {
                    datePicker.value = dates[0];
                    loadMap(dates[0]);
                }
            } catch (error) {
                console.error('读取地图日期.json失败:', error);
                datePicker.innerHTML = '<option>日期列表加载失败</option>';
                datePicker.disabled = true;
                empty.classList.remove('hidden');
                empty.querySelector('p').textContent = '日期列表加载失败，请检查地图日期.json文件';
            }
        }

        let scale = 1, tx = 0, ty = 0;
        const MIN_SCALE = 0.1, MAX_SCALE = 20;
        function applyTransform() {
            stage.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
            zoomVal.textContent = Math.round(scale * 100);
        }
        function fitToScreen() {
            if (!img.naturalWidth) { scale = 1; tx = 0; ty = 0; applyTransform(); return; }
            const w = wrapper.clientWidth, h = wrapper.clientHeight;
            const iw = img.naturalWidth, ih = img.naturalHeight;
            scale = Math.min(w / iw, h / ih, 1);
            tx = (w - iw * scale) / 2;
            ty = (h - ih * scale) / 2;
            applyTransform();
        }
        function zoomAt(factor, cx, cy) {
            const newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale * factor));
            const realFactor = newScale / scale;
            tx = cx - (cx - tx) * realFactor;
            ty = cy - (cy - ty) * realFactor;
            scale = newScale;
            applyTransform();
        }
        function loadMap(dateStr) { img.src = `map_${dateStr}.png`; }
        img.addEventListener('load', () => { empty.classList.add('hidden'); fitToScreen(); });
        img.addEventListener('error', () => { empty.classList.remove('hidden'); empty.querySelector('p').textContent = '当前区域暂时没有绘图'; });
        datePicker.addEventListener('change', () => loadMap(datePicker.value));

        // 鼠标滚轮缩放
        wrapper.addEventListener('wheel', e => {
            e.preventDefault();
            const rect = wrapper.getBoundingClientRect();
            zoomAt(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX - rect.left, e.clientY - rect.top);
        }, { passive: false });

        // 拖拽平移
        let dragging = false, sx = 0, sy = 0, sTx = 0, sTy = 0;
        wrapper.addEventListener('mousedown', e => { dragging = true; sx = e.clientX; sy = e.clientY; sTx = tx; sTy = ty; });
        window.addEventListener('mousemove', e => { if (!dragging) return; tx = sTx + (e.clientX - sx); ty = sTy + (e.clientY - sy); applyTransform(); });
        window.addEventListener('mouseup', () => dragging = false);

        function centerZoom(factor) { zoomAt(factor, wrapper.clientWidth/2, wrapper.clientHeight/2); }
        zoomInBtn.addEventListener('click', () => centerZoom(1.25));
        zoomOutBtn.addEventListener('click', () => centerZoom(1/1.25));
        resetBtn.addEventListener('click', fitToScreen);

        // 触摸支持
        let touches = [];
        wrapper.addEventListener('touchstart', e => {
            touches = Array.from(e.touches);
            if (touches.length === 1) { dragging = true; sx = touches[0].clientX; sy = touches[0].clientY; sTx = tx; sTy = ty; }
        }, { passive: true });
        wrapper.addEventListener('touchmove', e => {
            e.preventDefault();
            const t = Array.from(e.touches);
            if (t.length === 1 && dragging) { tx = sTx + (t[0].clientX - sx); ty = sTy + (t[0].clientY - sy); applyTransform(); }
            else if (t.length === 2 && touches.length === 2) {
                const rect = wrapper.getBoundingClientRect();
                const cx = (t[0].clientX + t[1].clientX)/2 - rect.left;
                const cy = (t[0].clientY + t[1].clientY)/2 - rect.top;
                const distNow = Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
                const distOld = Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
                if (distOld > 0) zoomAt(distNow / distOld, cx, cy);
            }
            touches = t;
        }, { passive: false });
        wrapper.addEventListener('touchend', () => { dragging = false; touches = []; });

        // 窗口尺寸变化
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => { if (img.naturalWidth) fitToScreen(); }, 150);
        });
        window.addEventListener('orientationchange', () => {
            setTimeout(() => { if (img.naturalWidth) fitToScreen(); }, 200);
        });

        // 启动
        loadDateList();
    })();
    </script>
</body>
