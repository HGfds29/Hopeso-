<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hopeso土豆服务器地图</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
            background: #0d1117;
            color: #e6edf3;
            user-select: none;
            display: flex;
            flex-direction: column;
        }
        /* 顶部标题栏 */
        .header {
            min-height: 56px;
            background: linear-gradient(90deg, #161b22, #1c2128);
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            z-index: 100;
            position: relative;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #58a6ff, #79c0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .version-badge {
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 600;
            color: #d29922;
            background: rgba(210,153,34,0.12);
            border: 1px solid rgba(210,153,34,0.35);
            border-radius: 10px;
            letter-spacing: 0.5px;
        }
        .header .spacer { flex: 1; }

        /* 顶部按钮通用样式 */
        .log-btn, .feedback-btn, .admin-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            color: #58a6ff;
            background: rgba(88,166,255,0.08);
            border: 1px solid rgba(88,166,255,0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            letter-spacing: 0.5px;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
        }
        .log-btn:hover, .feedback-btn:hover, .admin-btn:hover {
            background: rgba(88,166,255,0.18);
            border-color: #58a6ff;
            box-shadow: 0 0 12px rgba(88,166,255,0.25);
        }
        .log-btn:active, .feedback-btn:active, .admin-btn:active { transform: scale(0.96); }
        .log-btn .icon, .feedback-btn .icon, .admin-btn .icon { font-size: 16px; line-height: 1; }

        /* 日期下拉菜单 */
        .date-picker-wrap { display: flex; align-items: center; gap: 8px; }
        .date-picker-wrap label { font-size: 13px; color: #8b949e; }
        .date-picker {
            color-scheme: dark;
            background: #161b22;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s ease;
            min-width: 140px;
        }
        .date-picker:hover { border-color: #58a6ff; }
        .date-picker:focus { border-color: #58a6ff; box-shadow: 0 0 0 2px rgba(88,166,255,0.2); }
        .date-picker:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 地图容器 */
        .map-wrapper {
            position: relative;
            flex: 1;
            overflow: hidden;
            cursor: grab;
            touch-action: none;
            background: #0d1117;
        }
        .map-wrapper:active { cursor: grabbing; }

        /* 工具栏 */
        .toolbar {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn {
            width: 44px; height: 44px;
            border: 1px solid #30363d;
            background: #161b22;
            color: #e6edf3;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .btn:hover { background: #1f2937; border-color: #58a6ff; transform: translateY(-1px); }
        .btn:active { transform: scale(0.95); }
        .btn { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

        .map-stage { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; z-index: 1; }
        .map-stage img { display: block; max-width: none; pointer-events: none; }

        /* 棋盘格背景 */
        .bg-watermark {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                repeating-linear-gradient(0deg, rgba(88,166,255,0.05) 0, rgba(88,166,255,0.05) 1px, transparent 1px, transparent 48px),
                repeating-linear-gradient(90deg, rgba(88,166,255,0.05) 0, rgba(88,166,255,0.05) 1px, transparent 1px, transparent 48px),
                repeating-conic-gradient(#161b22 0% 25%, #1c2128 0% 50%);
            background-size: 48px 48px, 48px 48px, 48px 48px;
            background-position: 0 0, 0 0, 0 0;
        }

        .zoom-info {
            position: absolute; bottom: 16px; left: 20px;
            background: rgba(22,27,34,0.85);
            border: 1px solid #30363d;
            padding: 6px 12px; border-radius: 6px;
            font-size: 12px; color: #8b949e;
            backdrop-filter: blur(4px); z-index: 5;
        }
        .zoom-info span { color: #58a6ff; font-weight: 600; }

        /* 空状态 */
        .empty {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #8b949e; text-align: center; gap: 16px;
            pointer-events: none; z-index: 2;
        }
        .empty .icon { font-size: 48px; opacity: 0.4; }
        .empty p { font-size: 14px; }
        .hidden { display: none !important; }

        /* 加载指示器 */
        .loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: #8b949e;
            font-size: 14px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(88,166,255,0.2);
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 更新日志弹窗 & 反馈弹窗 */
        .log-modal-overlay, .feedback-modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            animation: fadeIn 0.2s ease;
            padding: 20px;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(24px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .log-modal, .feedback-modal {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            max-width: 520px; width: 100%; max-height: 75vh;
            display: flex; flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            animation: slideUp 0.28s cubic-bezier(0.22,1,0.36,1);
            overflow: hidden;
        }
        .log-modal-header, .feedback-modal-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 24px 14px;
            border-bottom: 1px solid #21262d;
        }
        .log-modal-header h2, .feedback-modal-header h2 { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .log-modal-close, .feedback-modal-close {
            width: 34px; height: 34px; border: none; background: transparent;
            color: #8b949e; font-size: 20px; cursor: pointer;
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
        }
        .log-modal-close:hover, .feedback-modal-close:hover { background: #21262d; color: #e6edf3; }
        .log-modal-body, .feedback-modal-body { padding: 18px 24px 24px; overflow-y: auto; flex: 1; }

        /* 更新日志样式 */
        .log-entry { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px dashed #21262d; }
        .log-entry:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .log-entry-version { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
        .ver-tag { font-size: 14px; font-weight: 700; color: #58a6ff; background: rgba(88,166,255,0.1); border: 1px solid rgba(88,166,255,0.25); padding: 3px 10px; border-radius: 6px; }
        .ver-date { font-size: 12px; color: #8b949e; }
        .ver-current { font-size: 11px; color: #d29922; background: rgba(210,153,34,0.12); border: 1px solid rgba(210,153,34,0.3); padding: 2px 8px; border-radius: 4px; font-weight: 600; }
        .log-entry ul { list-style: none; padding-left: 4px; }
        .log-entry li { position: relative; padding-left: 18px; font-size: 13px; color: #c9d1d9; line-height: 1.7; margin-bottom: 4px; }
        .log-entry li::before { content: ''; position: absolute; left: 2px; top: 10px; width: 6px; height: 6px; border-radius: 50%; background: #58a6ff; }
        .log-entry li.type-fix::before { background: #f0883e; }
        .log-entry li.type-new::before { background: #3fb950; }
        .log-entry li.type-opt::before { background: #a371f7; }
        .log-entry li.type-ui::before { background: #79c0ff; }

        /* 反馈弹窗内部样式 */
        .feedback-warning {
            background: rgba(210,153,34,0.1);
            border: 1px solid rgba(210,153,34,0.4);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 16px;
            color: #d29922;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .feedback-warning .warning-icon { font-size: 18px; flex-shrink: 0; }
        .feedback-template {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            font-family: "Consolas", "Monaco", monospace;
            font-size: 12px;
            color: #c9d1d9;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 16px;
        }
        .feedback-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .feedback-btn-copy, .feedback-btn-github, .feedback-btn-api {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid #30363d;
            background: #21262d;
            color: #e6edf3;
            transition: all 0.2s ease;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            -webkit-tap-highlight-color: transparent;
        }
        .feedback-btn-copy:hover, .feedback-btn-github:hover, .feedback-btn-api:hover {
            border-color: #58a6ff;
            background: #1f2937;
        }
        .feedback-btn-github { background: rgba(88,166,255,0.1); border-color: rgba(88,166,255,0.3); color: #58a6ff; }
        .feedback-btn-github:hover { background: rgba(88,166,255,0.18); }
        .feedback-btn-api { background: rgba(240,136,62,0.1); border-color: rgba(240,136,62,0.3); color: #f0883e; }
        .feedback-btn-api:hover { background: rgba(240,136,62,0.18); }

        /* 管理员信息展示 */
        .admin-contact-list {
            margin-top: 10px;
            padding: 10px;
            background: rgba(88,166,255,0.05);
            border-radius: 8px;
            border: 1px solid rgba(88,166,255,0.2);
        }
        .admin-contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #c9d1d9;
            padding: 4px 0;
        }
        .admin-contact-item a {
            color: #58a6ff;
            text-decoration: none;
        }
        .admin-contact-item a:hover { text-decoration: underline; }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .header { padding: 8px 12px; gap: 6px 10px; }
            .header h1 { font-size: 16px; }
            .version-badge { font-size: 11px; padding: 2px 8px; }
            .log-btn, .feedback-btn, .admin-btn { padding: 5px 10px; font-size: 12px; gap: 4px; }
            .date-picker-wrap { width: 100%; order: 3; }
            .date-picker { flex: 1; min-width: 0; font-size: 14px; padding: 8px 10px; }
            .toolbar { top: 12px; right: 12px; gap: 6px; }
            .btn { width: 40px; height: 40px; font-size: 18px; }
            .zoom-info { bottom: 12px; left: 12px; font-size: 11px; }
            .log-modal, .feedback-modal { max-width: 100%; max-height: 80vh; }
            .log-modal-body, .feedback-modal-body { padding: 14px 18px 18px; }
            .feedback-template { font-size: 11px; }
            .feedback-warning { font-size: 12px; }
        }
        @media (max-width: 480px) {
            .header h1 { font-size: 15px; }
            .log-btn, .feedback-btn, .admin-btn { font-size: 11px; padding: 4px 8px; }
            .btn { width: 38px; height: 38px; font-size: 17px; }
            .zoom-info { font-size: 10px; }
            .feedback-btn-copy, .feedback-btn-github, .feedback-btn-api { font-size: 12px; padding: 6px 12px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Hopeso土豆服务器地图</h1>
        <span class="version-badge" id="versionBadge"></span>
        <div class="spacer"></div>
        <button class="log-btn" id="logBtn" title="查看更新日志">
            <span>更新日志</span>
        </button>
        <button class="feedback-btn" id="feedbackBtn" title="提交网站反馈">
            <span>网站反馈</span>
        </button>
        <a class="admin-btn" href="admin.html" target="_blank" title="管理员页面">
            <span>管理员</span>
        </a>
        <div class="date-picker-wrap">
            <label for="datePicker">日期:</label>
            <select id="datePicker" class="date-picker" disabled>
                <option>加载中...</option>
            </select>
        </div>
    </div>

    <div class="map-wrapper" id="wrapper">
        <div class="bg-watermark"></div>
        <div class="map-stage" id="stage">
            <img id="mapImg" alt="地图">
        </div>
        <div class="toolbar">
            <button class="btn" id="zoomIn" title="放大">＋</button>
            <button class="btn" id="zoomOut" title="缩小">－</button>
            <button class="btn" id="reset" title="重置">⟳</button>
        </div>
        <div class="empty" id="empty">
            <div class="icon"></div>
            <p></p>
        </div>
        <div class="loading-indicator hidden" id="loadingIndicator">
            <div class="spinner"></div>
            <span>地图加载中...</span>
        </div>
    </div>

    <div class="zoom-info">缩放: <span id="zoomVal">100</span>%</div>

    <!-- 更新日志弹窗 -->
    <div class="log-modal-overlay hidden" id="logOverlay">
        <div class="log-modal">
            <div class="log-modal-header">
                <h2>版本更新日志</h2>
                <button class="log-modal-close" id="logClose">✕</button>
            </div>
            <div class="log-modal-body" id="logBody"></div>
        </div>
    </div>

    <!-- 反馈弹窗 -->
    <div class="feedback-modal-overlay hidden" id="feedbackOverlay">
        <div class="feedback-modal">
            <div class="feedback-modal-header">
                <h2>提交网站反馈</h2>
                <button class="feedback-modal-close" id="feedbackClose">✕</button>
            </div>
            <div class="feedback-modal-body">
                <div class="feedback-warning">
                    <span>fine-grained token 随时可能过期，如果无法正常提交反馈，请联系管理员。</span>
                </div>
                <div class="admin-contact-list" id="adminContactList" style="display:none;">
                    <div style="font-weight:600; margin-bottom:6px;">联系管理员：</div>
                </div>
                <p style="font-size:14px; color:#8b949e; margin-bottom:12px; margin-top:12px;">您可以选择复制模板手动提交，或使用下方按钮通过 API 直接提交（测试功能，存在安全风险）。</p>
                <div class="feedback-template" id="feedbackTemplate"></div>
                <div class="feedback-actions">
                    <button class="feedback-btn-copy" id="copyFeedback">复制反馈内容</button>
                    <button class="feedback-btn-github" id="openGithubIssue">打开 GitHub 新建 Issue</button>
                    <button class="feedback-btn-api" id="submitApiIssue">直接提交 Issue (API)</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ================== 配置 ==================
            const VERSION = 'beta3.2';
            document.getElementById('versionBadge').textContent = VERSION;
            document.title = `Hopeso土豆服务器地图 (${VERSION})`;

            const SUPABASE_URL = 'https://fnnikuyrxprbykyggxwy.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_e5JWjJVaHT9PvXtvuulh4A_OnjaQtvo';
            const REST_URL = `${SUPABASE_URL}/rest/v1`;
            const STORAGE_BUCKET = 'map_images';

            // ================== 通用 fetch 封装 ==================
            async function supabaseFetch(path, options = {}) {
                const headers = {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    'Content-Type': 'application/json',
                    ...options.headers
                };
                const response = await fetch(`${REST_URL}/${path}`, { ...options, headers });
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                return response.json();
            }

            // ================== 维护模式检查 ==================
            async function checkMaintenance() {
                try {
                    const data = await supabaseFetch('site_config?key=eq.maintenance&select=value');
                    const maintenance = data.length > 0 ? data[0].value : 'false';
                    if (maintenance === 'true') {
                        window.location.href = 'maintenance.html';
                    }
                } catch (e) {
                    console.warn('维护模式检查失败:', e);
                }
            }

            // ================== 更新日志弹窗 ==================
            const CHANGELOG = [
                {
                    version: 'beta3.2',
                    date: '2026-09-08',
                    current: true,
                    changes: [
                        { type: 'new', text: '全面迁移至 Supabase REST API，不依赖外部 SDK' },
                        { type: 'new', text: '新增维护模式检查，自动跳转维护页面' }
                    ]
                }
            ];

            function renderChangelog() {
                let html = '';
                CHANGELOG.forEach(entry => {
                    html += `<div class="log-entry">
                        <div class="log-entry-version">
                            <span class="ver-tag">${entry.version}</span>
                            ${entry.date ? `<span class="ver-date">${entry.date}</span>` : ''}
                            ${entry.current ? '<span class="ver-current">当前版本</span>' : ''}
                        </div>
                        <ul>`;
                    entry.changes.forEach(change => {
                        html += `<li class="type-${change.type}">${change.text}</li>`;
                    });
                    html += '</ul></div>';
                });
                document.getElementById('logBody').innerHTML = html;
            }

            function openLogModal() {
                renderChangelog();
                document.getElementById('logOverlay').classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            }
            function closeLogModal() {
                document.getElementById('logOverlay').classList.add('hidden');
                document.body.style.overflow = '';
            }

            // ================== 反馈弹窗 ==================
            function buildFeedbackTemplate() {
                const repo = "HGfds29/Hopeso-";
                const title = "【网站反馈】";
                const body = `## 反馈类型\n- [ ] Bug报错\n- [ ] 功能建议\n- [ ] 其他问题\n\n## 问题描述\n请在这里描述你的问题：\n\n## 当前页面地址\n${window.location.href}\n\n## 浏览器信息\n${navigator.userAgent}\n\n> 提示：可以直接截图粘贴到这里上传图片`;
                return { repo, title, body };
            }

            let currentRepo = '';
            let currentTitle = '';

            function openFeedbackModal() {
                const { repo, title, body } = buildFeedbackTemplate();
                currentRepo = repo;
                currentTitle = title;
                document.getElementById('feedbackTemplate').textContent = body;
                document.getElementById('feedbackOverlay').classList.remove('hidden');
                document.body.style.overflow = 'hidden';
                loadAdminContacts();
            }
            function closeFeedbackModal() {
                document.getElementById('feedbackOverlay').classList.add('hidden');
                document.body.style.overflow = '';
            }

            // 加载管理员联系方式
            let adminContactsLoaded = false;
            async function loadAdminContacts() {
                if (adminContactsLoaded) return;
                try {
                    const admins = await supabaseFetch('admins?select=*');
                    if (admins.length > 0) {
                        let html = '<div style="font-weight:600; margin-bottom:6px;">联系管理员：</div>';
                        admins.forEach(admin => {
                            html += `<div class="admin-contact-item">
                                <span>${admin.name}</span>
                                ${admin.role ? `<span style="color:#8b949e;">(${admin.role})</span>` : ''}
                                ${admin.github && admin.github !== 'no-github' ? `<a href="https://github.com/${admin.github}" target="_blank">GitHub</a>` : ''}
                                ${admin.email && admin.email !== 'no-email' ? `<a href="mailto:${admin.email}">邮箱</a>` : ''}
                            </div>`;
                        });
                        document.getElementById('adminContactList').innerHTML = html;
                        document.getElementById('adminContactList').style.display = 'block';
                        adminContactsLoaded = true;
                    }
                } catch (e) {
                    console.warn('无法加载管理员信息:', e);
                }
            }

            // 复制反馈内容
            async function copyFeedback() {
                const text = document.getElementById('feedbackTemplate').textContent;
                try {
                    await navigator.clipboard.writeText(text);
                    document.getElementById('copyFeedback').textContent = '已复制！';
                    setTimeout(() => document.getElementById('copyFeedback').innerHTML = '复制反馈内容', 2000);
                } catch {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    document.getElementById('copyFeedback').textContent = '已复制！';
                    setTimeout(() => document.getElementById('copyFeedback').innerHTML = '复制反馈内容', 2000);
                }
            }

            // 打开 GitHub Issue（手动）
            function openGithubIssue() {
                const baseUrl = `https://github.com/${currentRepo}/issues/new`;
                const params = new URLSearchParams({ title: currentTitle, body: document.getElementById('feedbackTemplate').textContent });
                window.open(`${baseUrl}?${params.toString()}`, '_blank');
            }

            // 直接提交 Issue（保留，但需要用户自己配置 token）
            function submitApiIssue() {
                alert('此功能需要您自行配置 GitHub Token，请从管理员页面设置。');
            }

            // ================== 日期加载 ==================
            async function loadDateList() {
                try {
                    const dates = await supabaseFetch('map_dates?select=date&order=date.desc');
                    if (dates.length === 0) throw new Error('日期列表为空');
                    const datePicker = document.getElementById('datePicker');
                    datePicker.innerHTML = '';
                    const today = new Date().toISOString().split('T')[0];
                    dates.forEach(item => {
                        const date = item.date;
                        const opt = document.createElement('option');
                        opt.value = date;
                        let label = date;
                        if (date === today) label += '（今天）';
                        else if (date === new Date(Date.now() - 86400000).toISOString().split('T')[0]) label += '（昨天）';
                        opt.textContent = label;
                        datePicker.appendChild(opt);
                    });
                    datePicker.disabled = false;
                    if (dates.length > 0) {
                        datePicker.value = dates[0].date;
                        loadMap(dates[0].date);
                    }
                } catch (error) {
                    console.error(error);
                    datePicker.innerHTML = '<option>日期列表加载失败</option>';
                    datePicker.disabled = true;
                    document.getElementById('empty').classList.remove('hidden');
                    document.getElementById('empty').querySelector('p').textContent = '日期列表加载失败';
                }
            }

            // ================== 地图加载 ==================
            const mapCache = new Map();

            function showLoading() { document.getElementById('loadingIndicator').classList.remove('hidden'); }
            function hideLoading() { document.getElementById('loadingIndicator').classList.add('hidden'); }

            async function fitToScreenAfterDecode() {
                try {
                    const img = document.getElementById('mapImg');
                    if (img.decode) await img.decode();
                    fitToScreen();
                } catch (e) {
                    fitToScreen();
                }
            }

            async function loadMap(dateStr) {
                showLoading();
                try {
                    const imageData = await supabaseFetch(`map_images?date=eq.${dateStr}&select=image_path`);
                    if (!imageData || imageData.length === 0) {
                        throw new Error('没有找到该日期的地图');
                    }
                    const imagePath = imageData[0].image_path;
                    const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${imagePath}`;
                    const img = document.getElementById('mapImg');
                    img.src = publicUrl;
                    mapCache.set(dateStr, publicUrl);
                    img.onload = function() {
                        hideLoading();
                        document.getElementById('empty').classList.add('hidden');
                        fitToScreenAfterDecode();
                    };
                    img.onerror = function() {
                        hideLoading();
                        document.getElementById('empty').classList.remove('hidden');
                        document.getElementById('empty').querySelector('p').textContent = '当前区域暂时没有绘图';
                    };
                } catch (err) {
                    hideLoading();
                    document.getElementById('empty').classList.remove('hidden');
                    document.getElementById('empty').querySelector('p').textContent = '当前区域暂时没有绘图';
                }
            }

            // ================== 缩放与平移 ==================
            let scale = 1, tx = 0, ty = 0;
            const MIN_SCALE = 0.1, MAX_SCALE = 20;
            const wrapper = document.getElementById('wrapper');
            const stage = document.getElementById('stage');
            const img = document.getElementById('mapImg');

            function applyTransform() {
                stage.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
                document.getElementById('zoomVal').textContent = Math.round(scale * 100);
            }

            function fitToScreen() {
                if (!img.naturalWidth) { scale = 1; tx = 0; ty = 0; applyTransform(); return; }
                const w = wrapper.clientWidth, h = wrapper.clientHeight;
                const iw = img.naturalWidth, ih = img.naturalHeight;
                scale = Math.min(w / iw, h / ih, 1);
                tx = (w - iw * scale) / 2;
                ty = (h - ih * scale) / 2;
                applyTransform();
            }

            function zoomAt(factor, cx, cy) {
                const newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale * factor));
                const realFactor = newScale / scale;
                tx = cx - (cx - tx) * realFactor;
                ty = cy - (cy - ty) * realFactor;
                scale = newScale;
                applyTransform();
            }

            function centerZoom(factor) {
                zoomAt(factor, wrapper.clientWidth / 2, wrapper.clientHeight / 2);
            }

            // 鼠标滚轮缩放
            wrapper.addEventListener('wheel', e => {
                e.preventDefault();
                const rect = wrapper.getBoundingClientRect();
                zoomAt(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX - rect.left, e.clientY - rect.top);
            }, { passive: false });

            // 鼠标拖拽
            let dragging = false, sx = 0, sy = 0, sTx = 0, sTy = 0;
            wrapper.addEventListener('mousedown', e => {
                dragging = true;
                sx = e.clientX; sy = e.clientY;
                sTx = tx; sTy = ty;
            });
            window.addEventListener('mousemove', e => {
                if (!dragging) return;
                tx = sTx + (e.clientX - sx);
                ty = sTy + (e.clientY - sy);
                applyTransform();
            });
            window.addEventListener('mouseup', () => { dragging = false; });

            // 触摸支持
            let touches = [];
            wrapper.addEventListener('touchstart', e => {
                touches = Array.from(e.touches);
                if (touches.length === 1) {
                    dragging = true;
                    sx = touches[0].clientX; sy = touches[0].clientY;
                    sTx = tx; sTy = ty;
                }
            }, { passive: true });
            wrapper.addEventListener('touchmove', e => {
                e.preventDefault();
                const t = Array.from(e.touches);
                if (t.length === 1 && dragging) {
                    tx = sTx + (t[0].clientX - sx);
                    ty = sTy + (t[0].clientY - sy);
                    applyTransform();
                } else if (t.length === 2 && touches.length === 2) {
                    const rect = wrapper.getBoundingClientRect();
                    const cx = (t[0].clientX + t[1].clientX) / 2 - rect.left;
                    const cy = (t[0].clientY + t[1].clientY) / 2 - rect.top;
                    const distNow = Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
                    const distOld = Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
                    if (distOld > 0) zoomAt(distNow / distOld, cx, cy);
                }
                touches = t;
            }, { passive: false });
            wrapper.addEventListener('touchend', () => { dragging = false; touches = []; });

            // 按钮事件
            document.getElementById('zoomIn').addEventListener('click', () => centerZoom(1.25));
            document.getElementById('zoomOut').addEventListener('click', () => centerZoom(1/1.25));
            document.getElementById('reset').addEventListener('click', fitToScreen);

            // 日期切换
            document.getElementById('datePicker').addEventListener('change', e => loadMap(e.target.value));

            // 窗口大小变化
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => { if (img.naturalWidth) fitToScreen(); }, 150);
            });
            window.addEventListener('orientationchange', () => {
                setTimeout(() => { if (img.naturalWidth) fitToScreen(); }, 200);
            });

            // ================== 绑定顶部按钮 ==================
            document.getElementById('logBtn').addEventListener('click', openLogModal);
            document.getElementById('logClose').addEventListener('click', closeLogModal);
            document.getElementById('logOverlay').addEventListener('click', e => {
                if (e.target === document.getElementById('logOverlay')) closeLogModal();
            });

            document.getElementById('feedbackBtn').addEventListener('click', openFeedbackModal);
            document.getElementById('feedbackClose').addEventListener('click', closeFeedbackModal);
            document.getElementById('feedbackOverlay').addEventListener('click', e => {
                if (e.target === document.getElementById('feedbackOverlay')) closeFeedbackModal();
            });
            document.getElementById('copyFeedback').addEventListener('click', copyFeedback);
            document.getElementById('openGithubIssue').addEventListener('click', openGithubIssue);
            document.getElementById('submitApiIssue').addEventListener('click', submitApiIssue);

            // ESC 关闭弹窗
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    if (!document.getElementById('logOverlay').classList.contains('hidden')) closeLogModal();
                    if (!document.getElementById('feedbackOverlay').classList.contains('hidden')) closeFeedbackModal();
                }
            });

            // ================== 初始化 ==================
            async function init() {
                await checkMaintenance();
                await loadDateList();
            }
            init();
        })();
    </script>
</body>
</html>
